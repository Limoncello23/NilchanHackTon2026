services:
  postgres:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: routine_dungeon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: beckend
      dockerfile: Dockerfile
      target: migrate
    container_name: migrate
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/routine_dungeon?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: beckend
      dockerfile: Dockerfile
      target: server
    container_name: app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/routine_dungeon?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: on-failure

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://app:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      app:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
